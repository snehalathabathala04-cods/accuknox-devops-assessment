
name: Wisecow CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            snehalatha04/wisecow:latest
            snehalatha04/wisecow:${{ github.sha }}

  deploy:
    name: Deploy to EC2 Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Wisecow using AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0bec03de36785280d" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo k3s kubectl set image deployment/wisecow wisecow=snehalatha04/wisecow:${IMAGE_TAG}\",\"sudo k3s kubectl rollout status deployment/wisecow --timeout=180s\"]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0bec03de36785280d"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0bec03de36785280d" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"
